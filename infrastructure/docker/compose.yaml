name: wob-ai-ranking

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wob}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wob}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  STORAGE_DIR: /data/storage
  # Envelope-encryption keys for stored files; keep them in a secrets manager in production.
  FILE_ENCRYPTION_KEYS: ${FILE_ENCRYPTION_KEYS:?set FILE_ENCRYPTION_KEYS in .env}
  FILE_ENCRYPTION_ACTIVE_KEY: ${FILE_ENCRYPTION_ACTIVE_KEY:-}
  MODEL_CACHE_DIR: /models
  # Embedding/reranking settings must be identical in the API (queries) and worker (passages).
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
  RERANKER_MODEL: ${RERANKER_MODEL:-jinaai/jina-reranker-v1-turbo-en}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  # Claim extraction: off until the data protection review approves external AI processing.
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  EXTERNAL_AI_PROCESSING_APPROVED: ${EXTERNAL_AI_PROCESSING_APPROVED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-opus-5.5}
  CLAIM_MODEL: ${CLAIM_MODEL:-claude-opus-5-5}
  # External research (FR-13): web searches about nominees. Needs the approval above too.
  RESEARCH_ENABLED: ${RESEARCH_ENABLED:-false}
  RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-}
  RESEARCH_MODEL: ${RESEARCH_MODEL:-claude-haiku-5-5}
  RESEARCH_EFFORT: ${RESEARCH_EFFORT:-medium}
  UPLOAD_REQUIRES_CONSENT: ${UPLOAD_REQUIRES_CONSENT:-false}

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wob}
      POSTGRES_USER: ${POSTGRES_USER:-wob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../../backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Browsers only send Secure cookies over HTTPS; local development is plain http.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MFA_REQUIRED_ROLES: '${MFA_REQUIRED_ROLES:-["admin","committee"]}'
      # Invitation emails (see .env.example). DigitalOcean blocks SMTP ports 25/465/587: use 2525.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Women on Boards Awards}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../../backend/var/storage:/data/storage
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  # Ingestion worker: scan, extract/OCR, chunk, embed. Reads originals; never modifies them.
  worker:
    build: ../../backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    environment:
      <<: *backend-env
      SCANNER: ${SCANNER:-clamav}
      CLAMD_HOST: clamav
    volumes:
      - ../../backend/var/storage:/data/storage:ro
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  # Malware scanner. Needs ~1.5 GB RAM and downloads signatures on first start.
  clamav:
    image: clamav/clamav:1.4.6
    environment:
      # Above the API's 50 MB per-file limit (clamd's default stream limit is 25 MB).
      CLAMD_CONF_StreamMaxLength: 60M
      CLAMD_CONF_MaxFileSize: 60M
      CLAMD_CONF_MaxScanSize: 200M
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
    profiles: ["scan"]

volumes:
  pgdata:
  models:
  clamav-db:

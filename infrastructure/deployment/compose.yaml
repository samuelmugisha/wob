# Production stack for a single server: Caddy (HTTPS) -> Next.js -> FastAPI, plus the worker,
# PostgreSQL/pgvector and ClamAV. Only Caddy is reachable from outside (ports 80/443).
# Secrets come from .env next to this file (see deploy.sh); it never goes in the repository.
# The wob-backend and wob-web images are built and shipped by deploy.sh, never built here.
# Every service has a memory cap (MEM_* in the env file), so one that runs away is killed and
# restarted instead of starving the whole server.
name: wob

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wob}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wob}
  ENVIRONMENT: production
  STORAGE_DIR: /data/storage
  FILE_ENCRYPTION_KEYS: ${FILE_ENCRYPTION_KEYS:?set FILE_ENCRYPTION_KEYS}
  FILE_ENCRYPTION_ACTIVE_KEY: ${FILE_ENCRYPTION_ACTIVE_KEY:-}
  MODEL_CACHE_DIR: /models
  EMBEDDING_PROVIDER: local
  EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  RERANKER_PROVIDER: local
  RERANKER_MODEL: jinaai/jina-reranker-v1-turbo-en
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  EXTERNAL_AI_PROCESSING_APPROVED: ${EXTERNAL_AI_PROCESSING_APPROVED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-opus-5.5}
  RESEARCH_ENABLED: ${RESEARCH_ENABLED:-false}
  RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-}
  RESEARCH_MODEL: ${RESEARCH_MODEL:-claude-haiku-5-5}
  RESEARCH_EFFORT: ${RESEARCH_EFFORT:-medium}
  UPLOAD_REQUIRES_CONSENT: ${UPLOAD_REQUIRES_CONSENT:-false}
  JURY_VERIFIES_SUPPORTING_DOCUMENTS: ${JURY_VERIFIES_SUPPORTING_DOCUMENTS:-true}
  # LangSmith tracing, metadata only (app/services/tracing.py).
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-wob-awards-2026}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    mem_limit: ${MEM_DB:-768m}
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wob}
      POSTGRES_USER: ${POSTGRES_USER:-wob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: wob-backend:latest
    restart: unless-stopped
    mem_limit: ${MEM_API:-1536m}
    logging: *logging
    environment:
      <<: *backend-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PUBLIC_BASE_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS}
      COOKIE_SECURE: "true"
      MFA_REQUIRED_ROLES: '${MFA_REQUIRED_ROLES:-["admin","committee"]}'
      # Invitation emails (see .env.example). DigitalOcean blocks SMTP ports 25/465/587: use 2525.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Women on Boards Awards}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - /srv/wob/storage:/data/storage
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: wob-backend:latest
    restart: unless-stopped
    mem_limit: ${MEM_WORKER:-1536m}
    logging: *logging
    command: ["python", "-m", "app.workers.main"]
    environment:
      <<: *backend-env
      SCANNER: clamav
      CLAMD_HOST: clamav
    volumes:
      - /srv/wob/storage:/data/storage:ro
      - models:/models
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    mem_limit: ${MEM_CLAMAV:-1536m}
    logging: *logging
    environment:
      # Reloading signatures alongside the old set briefly doubles clamd's memory past its cap.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_StreamMaxLength: 60M
      CLAMD_CONF_MaxFileSize: 60M
      CLAMD_CONF_MaxScanSize: 200M
    volumes:
      - clamav-db:/var/lib/clamav

  web:
    image: wob-web:latest
    restart: unless-stopped
    mem_limit: ${MEM_WEB:-384m}
    logging: *logging
    depends_on: [api]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    mem_limit: ${MEM_CADDY:-128m}
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

volumes:
  pgdata:
  models:
  clamav-db:
  caddy-data:
  caddy-config:
